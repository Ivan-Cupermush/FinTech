name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # kusok (native/kusok, C11): свои тесты на C и привязки к Node, затем сборка аддона для сервера.
      - run: npm run kusok:test
      - run: npm run kusok:build
      - run: npm run typecheck
      - run: npm test
      # Файловые тесты ещё раз — с оригиналами в kusok, а не в папке files/.
      - run: npm test -w server -- test/media.test.ts test/chats.test.ts test/knowledge.test.ts test/my-notes.test.ts test/sandbox.test.ts
        env:
          OFFIX_TEST_BLOBS: kusok
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile
      - run: npm run mobile:typecheck
      - run: npm run mobile:test
