# Отдельный server-блок для песочницы offix. Другие сайты на этом nginx он не трогает:
# запросы попадают сюда только по имени offix.147-45-43-34.sslip.io.
# Положить в /etc/nginx/sites-available/offix и включить ссылкой в sites-enabled (README, шаг 5).
server {
    listen 80;
    listen [::]:80;
    server_name offix.147-45-43-34.sslip.io;

    # Документы базы знаний и вложения чатов — до 200 МБ, как на сервере (UPLOAD_MAX_MB).
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Сокет чатов (socket.io) идёт через тот же адрес.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
}

# Если в /etc/nginx/nginx.conf или conf.d такого map ещё нет — он нужен для сокета.
# Повторное объявление nginx не примет: проверьте `grep -r connection_upgrade /etc/nginx`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
